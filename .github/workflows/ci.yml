name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/integration/requirements-ha-2026.10.4.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install -r tests/integration/requirements-ha-2026.10.4.txt
      - name: Check installed Python dependency consistency
        run: python -m pip check
      - name: Validate JSON and integration structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('custom_components/homekit_manager/manifest.json'), Path('custom_components/homekit_manager/strings.json'), Path('hacs.json')]:
              json.loads(path.read_text())
          for path in Path('custom_components/homekit_manager/translations').glob('*.json'):
              json.loads(path.read_text())
          required = ['__init__.py', 'manifest.json', 'config_flow.py', 'panel.py', 'websocket.py', 'www/homekit-manager.js']
          missing = [name for name in required if not (Path('custom_components/homekit_manager') / name).is_file()]
          if missing:
              raise SystemExit(f'Missing integration files: {missing}')
          PY
      - name: Reject tracked credentials and HomeKit persistence
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = re.compile(r'(^|/)(\.storage|secrets?\.yaml|\.env[^/]*)(/|$)|homekit\.(state|aids|iids)(/|$)|\.(pem|p12|key)$', re.I)
          offenders = [name for name in tracked if name and forbidden.search(name)]
          if offenders:
              raise SystemExit(f'Forbidden tracked paths: {offenders}')
          for name in tracked:
              if name and Path(name).is_symlink():
                  raise SystemExit(f'Symlink in tracked files: {name}')
              if name and Path(name).is_file():
                  if b'-----BEGIN ' + b'PRIVATE KEY-----' in Path(name).read_bytes():
                      raise SystemExit(f'Private key content in tracked file: {name}')
          PY
      - name: Build and verify reproducible release
        run: |
          python scripts/build_release.py --output /tmp/hkm-release-one
          python scripts/build_release.py --output /tmp/hkm-release-two
          cmp /tmp/hkm-release-one/*.zip /tmp/hkm-release-two/*.zip
      - name: Install pinned browser dependencies for real backend E2E
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Python syntax
        run: python -m compileall -q custom_components tests scripts
      - name: Lint source adapters and operation boundary
        run: |
          python -m pip install ruff==0.17.3
          ruff check scripts/{run_beta_integration.py,run_experimental_core_tests.py,verify_experimental_core_patch.py} tests/integration/_beta_pytest_adapter/sitecustomize.py custom_components/homekit_manager/{bulk.py,change_planner.py,compatibility.py,conversion.py,filtering.py,inventory.py,inventory_export.py,native_adapter.py,runtime_diagnostics.py,source_model.py,yaml_adapter.py,operations.py,homekit_reader.py,homekit_writer.py,positive_list.py,selection_reconciliation.py,write_grant.py,write_test_mode.py,coordinator.py,websocket.py,migration.py,safety.py} tests/{test_beta_compatibility_0105.py,test_bulk_0105.py,test_inventory_names_0105.py,test_conversion_0924.py,test_filter_core_contract_0100.py,test_inventory_quality.py,test_inventory_export_0108.py,test_runtime_diagnostics_0108.py,test_source_model_0924.py,test_writer_filter_boundary_0100.py,test_yaml_adapter.py,test_reader_redaction_0924.py,test_migration.py,test_release.py,test_selection_reconciliation_01010.py,test_security_negative_controls_021.py} tests/integration/{test_native_0924.py,test_hap_identity_0100.py,test_hap_loopback_0100.py,test_hap_yaml_loopback_0100.py,test_hap_process_restart_0100.py,_hap_restart_worker.py,test_hap_full_bootstrap_0100.py,_hap_full_bootstrap_worker.py,_native_beta_filter_worker.py,test_write_grant_0100.py,test_test_write_mode_0100.py,test_websocket_authorization_0100.py,test_yaml_core_0924.py,test_operation_service_0924.py,test_operation_websocket_0924.py,test_performance_probe_0100.py} --select E,F,B,S --ignore E501,S101
      - name: Static production write-boundary checks
        run: |
          grep -F "raise HomeKitWriteDisabled(WRITE_LOCK_REASON)" custom_components/homekit_manager/coordinator.py
          grep -F "if self.allow_production or not ((self.test_environment and self.apply_enabled) or self.production_grant is not None):" custom_components/homekit_manager/homekit_writer.py
          grep -F "await self.production_grant.verify(self.hass, diff.entry_id, \"user\")" custom_components/homekit_manager/homekit_writer.py
          grep -F 'raise HomeKitWriteDisabled(WRITE_LOCK_REASON)' custom_components/homekit_manager/operations.py
          grep -F 'return {"enabled": False, "reason": WRITE_LOCK_REASON' custom_components/homekit_manager/operations.py
          ! grep -F 'ConfirmedOperationAuthority' custom_components/homekit_manager/operations.py
          grep -F "if plan.authority_kind != policy.get(\"authority\") or plan.authority_id != policy.get(\"grant_id\"):" custom_components/homekit_manager/operations.py
          grep -F "self.pre_mutation_check()" custom_components/homekit_manager/homekit_writer.py
          grep -R "HomeKitWriteDisabled" -n custom_components/homekit_manager/homekit_writer.py
          grep -R "SOURCE_USER\|allow_production\|async_update_entry" -n custom_components/homekit_manager/homekit_writer.py
          ! grep -R "async_reload\|\.storage\|pairing" -n custom_components/homekit_manager/homekit_writer.py
      - name: Python tests
        run: pytest -q tests -m "not experimental_core"
      - name: Frontend tests
        run: |
          node --check custom_components/homekit_manager/www/homekit-manager.js
          node tests/frontend/test_panel.mjs
      - name: Audit full pinned Python runtime and enforce reviewed risk boundary
        run: |
          python -m pip install pip-audit==2.10.1
          python scripts/audit_python_dependencies.py
      - name: Publish full Python runtime audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-runtime-audit
          path: .audit/python-runtime-audit.json
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Responsive browser regression
        run: |
          npx playwright test -c tests/frontend/playwright.config.mjs tests/frontend/browser_regression.spec.mjs tests/frontend/screenshot_reference.spec.mjs --project=chromium --workers=1
          npx playwright test -c tests/frontend/playwright.config.mjs tests/frontend/browser_regression.spec.mjs tests/frontend/screenshot_reference.spec.mjs --project=webkit --workers=1

  experimental-core-native:
    runs-on: ubuntu-24.04
    env:
      HKM_EXPERIMENTAL_CORE_VERSION: '2026.10.4'
      HKM_EXPERIMENTAL_CORE_ROOT: ${{ runner.temp }}/hkm-core
      HKM_EXPERIMENTAL_CORE_EVIDENCE: ${{ runner.temp }}/hkm-experimental-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/integration/requirements-ha-2026.10.4.txt
      - name: Install Manager test dependencies
        run: python -m pip install -r tests/integration/requirements-ha-2026.10.4.txt
      - name: Verify Manager checkout identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$HKM_EXPERIMENTAL_CORE_EVIDENCE"
          cp .ci/experimental-core/manifest.json "$HKM_EXPERIMENTAL_CORE_EVIDENCE/manifest.json"
      - name: Resolve pinned Core provenance
        id: core-provenance
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          manifest = json.loads(Path('.ci/experimental-core/manifest.json').read_text())
          for key in ('base_commit', 'target_commit', 'target_tree', 'patch_sha256'):
              print(f'{key}={manifest[key]}')
          PY
      - name: Clone exact official Core base
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/home-assistant/core.git "$HKM_EXPERIMENTAL_CORE_ROOT"
          git -C "$HKM_EXPERIMENTAL_CORE_ROOT" fetch --depth=1 origin "${{ steps.core-provenance.outputs.base_commit }}"
          git -C "$HKM_EXPERIMENTAL_CORE_ROOT" checkout --detach "${{ steps.core-provenance.outputs.base_commit }}"
          test "$(git -C "$HKM_EXPERIMENTAL_CORE_ROOT" rev-parse HEAD)" = "${{ steps.core-provenance.outputs.base_commit }}"
      - name: Verify and apply reviewed Core patch
        run: |
          set -euo pipefail
          python scripts/verify_experimental_core_patch.py \
            --core-root "$HKM_EXPERIMENTAL_CORE_ROOT" \
            --manifest .ci/experimental-core/manifest.json \
            --evidence "$HKM_EXPERIMENTAL_CORE_EVIDENCE/patch-verification.json"
      - name: Run independent security negative controls
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_security_negative_controls_021.py \
            --junitxml="$HKM_EXPERIMENTAL_CORE_EVIDENCE/negative-controls.junit.xml"
      - name: Reject wrong Core before pytest
        run: |
          set -euo pipefail
          if python scripts/run_experimental_core_tests.py \
            --core-root "$HKM_EXPERIMENTAL_CORE_ROOT" \
            --core-commit 0000000000000000000000000000000000000000 \
            --core-version "$HKM_EXPERIMENTAL_CORE_VERSION" \
            tests -m experimental_core; then
            echo 'wrong-Core negative control unexpectedly passed' >&2
            exit 1
          fi
      - name: Reject tampered Core patch before apply
        run: |
          set -euo pipefail
          tampered="$RUNNER_TEMP/hkm-core-tampered.patch"
          cp .ci/experimental-core/hkm-core-2026.10.4-0.10.20.patch "$tampered"
          printf '\n# tampered\n' >> "$tampered"
          if python scripts/verify_experimental_core_patch.py \
            --verify-only \
            --manifest .ci/experimental-core/manifest.json \
            --patch "$tampered" \
            --evidence "$HKM_EXPERIMENTAL_CORE_EVIDENCE/tampered-patch.json"; then
            echo 'tampered-patch negative control unexpectedly passed' >&2
            exit 1
          fi
      - name: Run experimental Core migration suite with fail-closed checkout guard
        run: |
          set -euo pipefail
          python scripts/run_experimental_core_tests.py \
            --core-root "$HKM_EXPERIMENTAL_CORE_ROOT" \
            --core-commit "${{ steps.core-provenance.outputs.base_commit }}" \
            --core-version "$HKM_EXPERIMENTAL_CORE_VERSION" \
            --expected-tree "${{ steps.core-provenance.outputs.target_tree }}" \
            --artifacts-dir "$HKM_EXPERIMENTAL_CORE_EVIDENCE" \
            tests -m experimental_core
      - name: Archive experimental Core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-core-ci-evidence
          path: ${{ runner.temp }}/hkm-experimental-evidence
          if-no-files-found: error

  core-beta-native:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/integration/requirements-ha-2026.11.0b0.txt
      - name: Install isolated Core beta and HAP runtime
        run: python -m pip install -r tests/integration/requirements-ha-2026.11.0b0.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Install beta test plugin without its incompatible Core pin
        run: python -m pip install --no-deps pytest-homeassistant-custom-component==0.13.375
      - name: Run complete isolated Core beta integration suite
        run: python scripts/run_beta_integration.py
      - name: Pair, apply native sensor exclusions, reload and reconnect
        run: |
          beta_dir=$(mktemp -d)
          export HKM_FULL_BOOTSTRAP_DIR="$beta_dir"
          HKM_FULL_BOOTSTRAP_PHASE=pair python tests/integration/_hap_full_bootstrap_worker.py
          python tests/integration/_native_beta_filter_worker.py
          HKM_FULL_BOOTSTRAP_PHASE=reconnect HKM_EXPECT_BETA_EXCLUDES=1 python tests/integration/_hap_full_bootstrap_worker.py

