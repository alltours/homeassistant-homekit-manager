name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/integration/requirements-ha-2026.10.4.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install -r tests/integration/requirements-ha-2026.10.4.txt
      - name: Check installed Python dependency consistency
        run: python -m pip check
      - name: Validate JSON and integration structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('custom_components/homekit_manager/manifest.json'), Path('custom_components/homekit_manager/strings.json'), Path('hacs.json')]:
              json.loads(path.read_text())
          for path in Path('custom_components/homekit_manager/translations').glob('*.json'):
              json.loads(path.read_text())
          required = ['__init__.py', 'manifest.json', 'config_flow.py', 'panel.py', 'websocket.py', 'www/homekit-manager.js']
          missing = [name for name in required if not (Path('custom_components/homekit_manager') / name).is_file()]
          if missing:
              raise SystemExit(f'Missing integration files: {missing}')
          PY
      - name: Reject tracked credentials and HomeKit persistence
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = re.compile(r'(^|/)(\.storage|secrets?\.yaml|\.env[^/]*)(/|$)|homekit\.(state|aids|iids)(/|$)|\.(pem|p12|key)$', re.I)
          offenders = [name for name in tracked if name and forbidden.search(name)]
          if offenders:
              raise SystemExit(f'Forbidden tracked paths: {offenders}')
          for name in tracked:
              if name and Path(name).is_symlink():
                  raise SystemExit(f'Symlink in tracked files: {name}')
              if name and Path(name).is_file():
                  if b'-----BEGIN ' + b'PRIVATE KEY-----' in Path(name).read_bytes():
                      raise SystemExit(f'Private key content in tracked file: {name}')
          PY
      - name: Build and verify reproducible release
        run: |
          python scripts/build_release.py --output /tmp/hkm-release-one
          python scripts/build_release.py --output /tmp/hkm-release-two
          cmp /tmp/hkm-release-one/*.zip /tmp/hkm-release-two/*.zip
          sha256sum /tmp/hkm-release-one/*.zip > /tmp/hkm-release-one/homekit-manager-release.sha256
      - name: Archive reproducible release package
        uses: actions/upload-artifact@v4
        with:
          name: homekit-manager-0.11.0-release
          path: /tmp/hkm-release-one/
          if-no-files-found: error
      - name: Install pinned browser dependencies for real backend E2E
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Python syntax
        run: python -m compileall -q custom_components tests scripts
      - name: Lint source adapters and operation boundary
        run: |
          python -m pip install ruff==0.17.3
          ruff check scripts/{run_beta_integration.py,run_experimental_core_tests.py,verify_experimental_core_patch.py,plan_positive_list.py} tests/integration/_beta_pytest_adapter/sitecustomize.py custom_components/homekit_manager/{bulk.py,change_planner.py,compatibility.py,conversion.py,filtering.py,inventory.py,inventory_export.py,native_adapter.py,positive_list_planning.py,runtime_diagnostics.py,source_model.py,yaml_adapter.py,operations.py,homekit_reader.py,homekit_writer.py,positive_list.py,selection_reconciliation.py,write_grant.py,write_test_mode.py,coordinator.py,websocket.py,migration.py,safety.py} tests/{test_beta_compatibility_0105.py,test_bulk_0105.py,test_inventory_names_0105.py,test_conversion_0924.py,test_filter_core_contract_0100.py,test_inventory_quality.py,test_inventory_export_0108.py,test_runtime_diagnostics_0108.py,test_source_model_0924.py,test_writer_filter_boundary_0100.py,test_yaml_adapter.py,test_reader_redaction_0924.py,test_migration.py,test_release.py,test_selection_reconciliation_01010.py,test_reconciliation_finalization_031.py,test_security_negative_controls_021.py} tests/integration/{test_native_0924.py,test_hap_identity_0100.py,test_hap_loopback_0100.py,test_hap_yaml_loopback_0100.py,test_hap_process_restart_0100.py,_hap_restart_worker.py,test_hap_full_bootstrap_0100.py,_hap_full_bootstrap_worker.py,_native_beta_filter_worker.py,test_write_grant_0100.py,test_test_write_mode_0100.py,test_websocket_authorization_0100.py,test_yaml_core_0924.py,test_operation_service_0924.py,test_operation_websocket_0924.py,test_performance_probe_0100.py} --select E,F,B,S --ignore E501,S101
      - name: Static production write-boundary checks
        run: |
          grep -F "raise HomeKitWriteDisabled(WRITE_LOCK_REASON)" custom_components/homekit_manager/coordinator.py
          grep -F "if self.allow_production or not ((self.test_environment and self.apply_enabled) or self.production_grant is not None):" custom_components/homekit_manager/homekit_writer.py
          grep -F "await self.production_grant.verify(self.hass, diff.entry_id, \"user\")" custom_components/homekit_manager/homekit_writer.py
          grep -F 'raise HomeKitWriteDisabled(WRITE_LOCK_REASON)' custom_components/homekit_manager/operations.py
          grep -F 'return {"enabled": False, "reason": WRITE_LOCK_REASON' custom_components/homekit_manager/operations.py
          ! grep -F 'ConfirmedOperationAuthority' custom_components/homekit_manager/operations.py
          grep -F 'if plan.authority_kind == "local_grant":' custom_components/homekit_manager/operations.py
          grep -F 'Rollback benötigt eine neue, unabhängige Schreibfreigabe' custom_components/homekit_manager/operations.py
          grep -F "self.pre_mutation_check()" custom_components/homekit_manager/homekit_writer.py
          grep -R "HomeKitWriteDisabled" -n custom_components/homekit_manager/homekit_writer.py
          grep -R "SOURCE_USER\|allow_production\|async_update_entry" -n custom_components/homekit_manager/homekit_writer.py
          ! grep -R "async_reload\|\.storage\|pairing" -n custom_components/homekit_manager/homekit_writer.py
      - name: Python tests
        run: pytest -q tests -m "not experimental_core"
      - name: Frontend tests
        run: |
          node --check custom_components/homekit_manager/www/homekit-manager.js
          node tests/frontend/test_panel.mjs
      - name: Audit full pinned Python runtime and enforce reviewed risk boundary
        run: |
          python -m pip install pip-audit==2.10.1
          python scripts/audit_python_dependencies.py
      - name: Publish full Python runtime audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-runtime-audit
          path: .audit/python-runtime-audit.json
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Responsive browser regression
        run: |
          npx playwright test -c tests/frontend/playwright.config.mjs tests/frontend/browser_regression.spec.mjs tests/frontend/screenshot_reference.spec.mjs --project=chromium --workers=1
          npx playwright test -c tests/frontend/playwright.config.mjs tests/frontend/browser_regression.spec.mjs tests/frontend/screenshot_reference.spec.mjs --project=webkit --workers=1

  acceptance:
    name: Official Core HAP acceptance
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .:tests/integration:tests/acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/integration/requirements-ha-2026.10.4.txt
      - name: Install official Core and HAP dependencies
        run: python -m pip install -r tests/integration/requirements-ha-2026.10.4.txt
      - name: Verify official Core version and run real two-bridge acceptance
        run: |
          set -euo pipefail
          python - <<'PY'
          from homeassistant.const import __version__
          assert __version__ == '2026.10.4', __version__
          print(__version__)
          PY
          acceptance_dir="$(mktemp -d)"
          HKM_ACCEPTANCE_DIR="$acceptance_dir" HKM_ACCEPTANCE_PHASE=pair_apply \
            python tests/acceptance/real_core_hap_apply_026.py | tee "$RUNNER_TEMP/hkm030-pair.log"
          HKM_ACCEPTANCE_DIR="$acceptance_dir" HKM_ACCEPTANCE_PHASE=reconnect \
            python tests/acceptance/real_core_hap_apply_026.py | tee "$RUNNER_TEMP/hkm030-reconnect.log"
          cp "$acceptance_dir/baseline.json" "$RUNNER_TEMP/hkm030-baseline.json"
          cp "$acceptance_dir/after_apply.json" "$RUNNER_TEMP/hkm030-after-apply.json"
          selection_acceptance_dir="$(mktemp -d)"
          HKM_ACCEPTANCE_DIR="$selection_acceptance_dir" HKM_ACCEPTANCE_PHASE=pair_apply HKM_ACCEPTANCE_SELECTION=1 \
            python tests/acceptance/real_core_hap_apply_026.py | tee "$RUNNER_TEMP/hkm030-selection-pair.log"
          HKM_ACCEPTANCE_DIR="$selection_acceptance_dir" HKM_ACCEPTANCE_PHASE=reconnect HKM_ACCEPTANCE_SELECTION=1 \
            python tests/acceptance/real_core_hap_apply_026.py | tee "$RUNNER_TEMP/hkm030-selection-reconnect.log"
          EVIDENCE_DIR="$RUNNER_TEMP" python - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = Path(os.environ["EVIDENCE_DIR"])
          baseline = json.loads((evidence / "hkm030-baseline.json").read_text())
          after = json.loads((evidence / "hkm030-after-apply.json").read_text())
          assert baseline["b"]["names"] == after["b"]["names"]
          assert baseline["b"]["signatures"] == after["b"]["signatures"]
          assert baseline["a"]["mac"] == after["a"]["mac"]
          assert baseline["b"]["mac"] == after["b"]["mac"]
          assert after["result"]["state"] == "verified"
          assert after["result"]["runtime_verification"] == "verified"
          assert after["result"]["pairing_verified"] is True
          print("HAP acceptance evidence verified")
          PY
      - name: Archive official Core acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-core-hap-acceptance-030
          path: |
            ${{ runner.temp }}/hkm030-*.log
            ${{ runner.temp }}/hkm030-*.json
          if-no-files-found: ignore
