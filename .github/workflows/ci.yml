name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/integration/requirements-ha-2026.10.4.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install -r tests/integration/requirements-ha-2026.10.4.txt
      - name: Validate JSON and integration structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('custom_components/homekit_manager/manifest.json'), Path('custom_components/homekit_manager/strings.json'), Path('hacs.json')]:
              json.loads(path.read_text())
          for path in Path('custom_components/homekit_manager/translations').glob('*.json'):
              json.loads(path.read_text())
          required = ['__init__.py', 'manifest.json', 'config_flow.py', 'panel.py', 'websocket.py', 'www/homekit-manager.js']
          missing = [name for name in required if not (Path('custom_components/homekit_manager') / name).is_file()]
          if missing:
              raise SystemExit(f'Missing integration files: {missing}')
          PY
      - name: Verify release manifest and file hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('custom_components/homekit_manager')
          release = json.loads(Path('docs/RELEASE_MANIFEST.json').read_text())
          manifest = json.loads((root / 'manifest.json').read_text())
          if release['integration_version'] != manifest['version']:
              raise SystemExit('Release manifest version does not match integration manifest')
          files = release['files']
          if release['file_count'] != len(files):
              raise SystemExit('Release manifest file_count is inconsistent')
          for item in files:
              path = root / item['path']
              if not path.is_file():
                  raise SystemExit(f'Missing release file: {item["path"]}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item['sha256']:
                  raise SystemExit(f'Hash mismatch: {item["path"]}')
          print(f"Verified {len(files)} release files for version {manifest['version']}")
          PY
      - name: Python syntax
        run: python -m compileall -q custom_components tests
      - name: Static read-only safety checks
        run: |
          ! grep -R "apply_enabled[[:space:]]*=[[:space:]]*True" -n custom_components
          grep -R "HomeKitWriteDisabled" -n custom_components/homekit_manager/homekit_writer.py
          grep -R "SOURCE_USER\|allow_production\|async_update_entry" -n custom_components/homekit_manager/homekit_writer.py
          ! grep -R "async_reload\|\.storage\|pairing" -n custom_components/homekit_manager/homekit_writer.py
      - name: Python tests
        run: pytest -c tests/integration/pytest.ini -q tests/integration tests/test_homekit_manager.py tests/test_config_source.py
      - name: Frontend tests
        run: |
          node --check custom_components/homekit_manager/www/homekit-manager.js
          node tests/frontend/test_panel.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm install --no-save @playwright/test playwright
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Responsive browser regression
        run: |
          npx playwright test -c tests/frontend/playwright.config.mjs tests/frontend/browser_regression.spec.mjs --project=chromium
          npx playwright test -c tests/frontend/playwright.config.mjs tests/frontend/browser_regression.spec.mjs --project=webkit

