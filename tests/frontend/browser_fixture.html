<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HomeKit Manager browser fixture</title>
    <script type="module">
      import "../../custom_components/homekit_manager/www/homekit-manager.js";

      const entities = [
        {
          entity_id: "light.kitchen",
          name: "Kitchen light",
          area_name: "Kitchen",
          device_name: "Kitchen device",
          integration_domain: "demo",
          domain: "light",
          available: true,
          compatibility: { status: "supported", expected_type: "Lightbulb" },
          homekit: { configured_by_filter: true, current_status: "included", filter_reason: "domain_include", published: "unknown" },
        },
        {
          entity_id: "sensor.temperature",
          name: "Temperature",
          area_name: "Hall",
          device_name: "Hall device",
          integration_domain: "demo",
          domain: "sensor",
          available: true,
          compatibility: { status: "supported", expected_type: "TemperatureSensor" },
          homekit: { configured_by_filter: false, current_status: "excluded", filter_reason: "not_in_include", published: "unknown" },
        },
      ];
      let savedDocument = { schema_version: 1, bridges: {} };
      let desiredMode = "homekit_bridge";
      let managementActive = new URLSearchParams(window.location.search).has("activation-error");
      const hass = {
        states: { "light.kitchen": {}, "sensor.temperature": {} },
        callWS: async (message) => {
          if (new URLSearchParams(window.location.search).has("error")) {
            throw new Error("Fixture-WebSocket nicht erreichbar");
          }
          if (message.type === "homekit_manager/inventory") {
            return {
              overview: {
                total_entities: entities.length,
                active_entities: entities.length,
                disabled_entities: 0,
                unavailable_entities: 0,
                compatible_entities: entities.length,
                configured_entities: 1,
                fingerprint: "fixture-fingerprint",
              },
              entities,
            };
          }
          if (message.type === "homekit_manager/bridges") {
            return { bridges: [{ entry_id: "fixture-bridge", title: "Fixture Bridge", source: "user", mode: "bridge", filter: { include_domains: ["light"] } }] };
          }
          if (message.type === "homekit_manager/history") {
            return { entries: [], count: 0 };
          }
          if (message.type === "homekit_manager/select_bridge") {
            return { selected_bridge_id: message.entry_id, overview: { selected_bridge_id: message.entry_id } };
          }
          if (message.type === "homekit_manager/yaml_status") {
            return { exists: Object.keys(savedDocument.bridges || {}).length > 0, valid: true, document: savedDocument, file_version: "fixture-version", fingerprint: "fixture-fingerprint", is_applied: false };
          }
          if (message.type === "homekit_manager/mode_status") {
            return { active_mode: "homekit_bridge", desired_mode: desiredMode, transition: "stable", matrix: {} };
          }
          if (message.type === "homekit_manager/set_mode") {
            desiredMode = message.mode;
            return { active_mode: "homekit_bridge", desired_mode: desiredMode, transition: "prepared", matrix: {} };
          }
          if (message.type === "homekit_manager/activation_status") {
            return { state: "unknown", entry_id: "fixture-bridge", message: "Kein Anwendungsvorgang" };
          }
          if (message.type === "homekit_manager/migration_plan") {
            const target = message.target || desiredMode;
            return { source: "homekit_bridge", target, supported: target === "homekit_bridge", status: target === "homekit_bridge" ? "verify_only" : "blocked", reason: target === "homekit_bridge" ? "Quelle wird read-only verifiziert" : "Migration ist aus Sicherheitsgründen gesperrt", steps: [{ key: "validate", label: "Konfiguration prüfen", progress: 16 }] };
          }
          if (message.type === "homekit_manager/migration_status") {
            return { state: "unknown", stale: true };
          }
          if (message.type === "homekit_manager/management_status") {
            return { state: managementActive ? "active" : "not_enabled", configuration_source: "home_assistant", configuration_source_label: "Home Assistant", management_surface: managementActive ? "homekit_manager" : "home_assistant", management_surface_label: managementActive ? "HomeKit Manager" : "Home Assistant", supported: true, active: managementActive, write_status: managementActive ? "available" : "locked", write_status_label: managementActive ? "Verfügbar" : "Gesperrt", bridge_title: "Fixture Bridge", message: managementActive ? "HomeKit Manager verwaltet diese Bridge jetzt." : "HomeKit Manager kann diese bestehende Bridge nach Bestätigung verwalten." };
          }
          if (message.type === "homekit_manager/management_enable") {
            managementActive = true;
            return { state: "active", configuration_source: "home_assistant", configuration_source_label: "Home Assistant", management_surface: "homekit_manager", management_surface_label: "HomeKit Manager", supported: true, active: true, bridge_title: "Fixture Bridge", message: "HomeKit Manager verwaltet diese Bridge jetzt." };
          }
          if (message.type === "homekit_manager/management_disable") {
            managementActive = false;
            return { state: "inactive", configuration_source: "home_assistant", configuration_source_label: "Home Assistant", management_surface: "home_assistant", management_surface_label: "Home Assistant", supported: true, active: false, bridge_title: "Fixture Bridge", write_status: "locked", write_status_label: "Gesperrt", message: "Die Verwaltung wurde auf Home Assistant zurückgestellt." };
          }
          if (message.type === "homekit_manager/devices") {
            return { devices: [{ device_id: "fixture-device", name: "Kitchen device", area_name: "Kitchen", entity_count: 1, compatible_count: 1, configured_count: 1, unavailable_count: 0, integrations: ["demo"] }] };
          }
          if (message.type === "homekit_manager/areas") {
            return { areas: [{ area_id: "fixture-area", name: "Kitchen", device_count: 1, entity_count: 1, compatible_count: 1, configured_count: 1, unavailable_count: 0 }] };
          }
          if (message.type === "homekit_manager/diagnostics") {
            return { findings: [], summary: { total: 0, critical: 0, warning: 0, info: 0, success: 0 } };
          }
          if (message.type === "homekit_manager/rules_preview") {
            return { rules: [], suggestions: [], applied: false };
          }
          if (message.type === "homekit_manager/performance") {
            return { entity_count: entities.length, render_ms: 1, websocket_calls: 1 };
          }
          if (message.type === "homekit_manager/device_preview") {
            return { simulation: true, title: "Kitchen light", service_type: "Lightbulb", applied: false };
          }
          if (message.type === "homekit_manager/validate_draft") {
            return { valid: true, warnings: [], document: message.document, fingerprint: "fixture-fingerprint" };
          }
          if (message.type === "homekit_manager/preview") {
            return {
              valid: true,
              changes: [{ entity_id: "light.kitchen", current: "included", desired: "excluded", action: "remove", reason: "explicit_exclude" }],
              summary: { blocked: false },
              fingerprint: "fixture-fingerprint",
            };
          }
          if (message.type === "homekit_manager/export") {
            return { format: "yaml", content: "schema_version: 1\nbridges: {}\n" };
          }
          if (message.type === "homekit_manager/save_draft") {
            savedDocument = message.document;
            return { exists: true, valid: true, document: savedDocument, file_version: "fixture-version-2", fingerprint: "fixture-fingerprint-2", is_applied: false };
          }
          if (message.type === "homekit_manager/apply_options_diff") {
            if (new URLSearchParams(window.location.search).has("activation-error")) throw new Error("Verbindung unterbrochen");
            return { applied: true, activation: "core_update_listener", activation_status: "active", entry_id: "fixture-bridge", core_version: "2026.10.4" };
          }
          throw new Error(`Unsupported fixture command: ${message.type}`);
        },
      };
      window.addEventListener("DOMContentLoaded", () => {
        document.querySelector("homekit-manager-panel").hass = hass;
      }, { once: true });
    </script>
  </head>
  <body style="margin:0;background:#111;color:#fff">
    <homekit-manager-panel></homekit-manager-panel>
  </body>
</html>
