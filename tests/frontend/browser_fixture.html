<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HomeKit Manager browser fixture</title>
    <style>:root{--primary-background-color:#f5f6f8;--card-background-color:#fff;--primary-text-color:#202124;--secondary-text-color:#606873;--divider-color:#dfe2e7;--primary-color:#0075b9;--secondary-background-color:#eef1f4;--warning-color:#a55b00;--success-color:#268235}@media(prefers-color-scheme:dark){:root{--primary-background-color:#101418;--card-background-color:#1c2229;--primary-text-color:#eef2f6;--secondary-text-color:#a7b0bc;--divider-color:#38424d;--primary-color:#6cbdf4;--secondary-background-color:#272f38;--warning-color:#ffc66b;--success-color:#7bd394;--text-primary-color:#082130}}</style>
    <script type="module">
      import "../../custom_components/homekit_manager/www/homekit-manager.js";

      const entities = [
        {
          entity_id: "light.kitchen", device_id: "device-kitchen", area_id: "kitchen", registry_entry_present: true, state_present: true, device_registry_status: "main",
          name: "Kitchen light",
          area_name: "Kitchen",
          device_name: "Kitchen device",
          integration_domain: "demo",
          domain: "light",
          available: true,
          compatibility: { status: "supported", expected_type: "Lightbulb" },
          homekit: { configured_by_filter: true, current_status: "included", filter_reason: "domain_include", published: "unknown" },
        },
        {
          entity_id: "sensor.temperature", device_id: "device-hall", area_id: "hall", registry_entry_present: true, state_present: true, device_registry_status: "main",
          name: "Temperature",
          area_name: "Hall",
          device_name: "Hall device",
          integration_domain: "sensor_demo",
          domain: "sensor",
          available: false,
          compatibility: { status: "conditionally_supported", expected_type: "TemperatureSensor" },
          homekit: { configured_by_filter: false, current_status: "excluded", filter_reason: "not_in_include", published: "unknown" },
        },
      ];
      const params = new URLSearchParams(window.location.search);
      const pagedEntities = params.has("paged") ? Array.from({ length: 5000 }, (_, index) => ({
        entity_id: `light.paged_${index}`, name: `Paged Lamp ${index}`, domain: "light", registry_entry_present: true, state_present: true,
        available: true, availability_status: "available", integration_domain: "demo",
        compatibility: { status: "supported" },
        homekit: { configured_by_filter: true, current_status: "included" },
      })) : entities;
      let savedDocument = { schema_version: 1, bridges: {} };
      let managementActive = new URLSearchParams(window.location.search).has("activation-error");
      const isolatedWrite = new URLSearchParams(window.location.search).has("isolated-write");
      let operationState = "validated";
      let testModeActive = false;
      window.fixtureCommands = [];
      const hass = {
        states: { "light.kitchen": {}, "sensor.temperature": {} },
        callWS: async (message) => {
          window.fixtureCommands.push(message.type);
          if (new URLSearchParams(window.location.search).has("error")) {
            throw new Error("Fixture-WebSocket nicht erreichbar");
          }
          if (message.type === "homekit_manager/inventory") {
            const response = {
              overview: {
                total_entities: pagedEntities.length,
                active_entities: pagedEntities.length,
                disabled_entities: 0,
                unavailable_entities: 1,
                compatible_entities: 1,
                configured_entities: 1,
                integration_version: "0.10.6", core_version: params.has("core-beta") ? "2026.11.0b0" : "2026.10.4", last_updated: "2026-10-27T08:00:00Z", refresh_duration_ms: 3.2, refresh_count: 1, unavailable_entities: 1, accessories: 1, write_policy: { enabled: false }, operation_policy: { enabled: isolatedWrite || testModeActive, reason: isolatedWrite ? "Nur isolierte Testinstanz" : testModeActive ? "Befristeter nativer Testmodus aktiv" : "HomeKit-Schreibpfad gesperrt" },
                test_write_mode: { enabled: testModeActive, entry_id: testModeActive ? "fixture-bridge" : null, expires_at: testModeActive ? "2026-10-28T23:00:00Z" : null, persistent: false, duration_minutes: 60 },
                fingerprint: "fixture-fingerprint",
              },
              entities: params.has("paged") ? pagedEntities.slice(message.offset || 0, (message.offset || 0) + (message.limit || 500)) : entities,
            };
            if (params.has("paged")) Object.assign(response, {
              total: pagedEntities.length, offset: message.offset || 0, limit: message.limit || 500,
              snapshot_revision: 1,
              fingerprint: params.has("stale-page") && message.offset >= 500 ? "changed-fingerprint" : "fixture-fingerprint",
            });
            return response;
          }
          if (message.type === "homekit_manager/bulk_preview") {
            if (message.entry_id !== "fixture-bridge" || message.fingerprint !== "fixture-fingerprint") throw new Error("Bridge oder Inventar haben sich verändert");
            const inventory = document.querySelector("homekit-manager-panel")?.entities || pagedEntities;
            const members = message.kind === "device" ? inventory.filter(item => `device:${item.device_id}` === message.key)
              : message.kind === "area" ? inventory.filter(item => { const id = item.device_id && "device_area_id" in item ? item.device_area_id : item.area_id; const name = item.device_id && "device_area_id" in item ? item.device_area_name : item.area_name; return (id ? `area:${id}` : `name:${name || "Ohne Bereich"}`) === message.key; })
              : inventory.filter(item => message.entity_ids.includes(item.entity_id));
            const eligible = members.filter(item => !item.disabled_by && !item.hidden_by && !item.entity_category && item.compatibility?.status === "supported" && item.homekit?.configured_by_filter != null);
            const skipped = {};
            for (const item of members) if (!eligible.includes(item)) { const reason = item.disabled_by ? "disabled" : item.hidden_by ? "hidden" : item.entity_category === "diagnostic" ? "diagnostic" : item.entity_category === "config" ? "config" : item.entity_category ? "entity_category" : item.compatibility?.status === "conditionally_supported" ? "conditional" : item.compatibility?.status === "unsupported" ? "unsupported" : "compatibility_unknown"; skipped[reason] = (skipped[reason] || 0) + 1; }
            return { entry_id: message.entry_id, fingerprint: message.fingerprint, total: members.length, eligible_entity_ids: eligible.map(item => item.entity_id), skipped, skipped_total: members.length - eligible.length };
          }
          if (message.type === "homekit_manager/bridges") {
            return { bridges: [{ entry_id: "fixture-bridge", title: "Fixture Bridge", source: "user", state: "loaded", mode: "bridge", filter: { include_domains: ["light"] }, data: { name: "Fixture Bridge", port: 21088 }, options: { mode: "bridge", filter: { include_domains: ["light"] } } }] };
          }
          if (message.type === "homekit_manager/history") {
            return { entries: [], count: 0 };
          }
          if (message.type === "homekit_manager/select_bridge") {
            return { selected_bridge_id: message.entry_id, overview: { selected_bridge_id: message.entry_id } };
          }
          if (message.type === "homekit_manager/yaml_status") {
            return { exists: Object.keys(savedDocument.bridges || {}).length > 0, valid: true, document: savedDocument, file_version: "fixture-version", fingerprint: "fixture-fingerprint", is_applied: false };
          }
          if (message.type === "homekit_manager/mode_status") {
            return { active_mode: "homekit_bridge", desired_mode: "homekit_bridge", transition: "stable", matrix: {} };
          }
          if (message.type === "homekit_manager/set_mode") {
            throw new Error("Quellenmigration ist nicht vorgesehen");
          }
          if (message.type === "homekit_manager/activation_status") {
            return { state: "unknown", entry_id: "fixture-bridge", has_operation: new URLSearchParams(window.location.search).has("activation-error"), message: "Kein bestätigter Aktivierungsnachweis", observations: { bridge_state: "loaded" } };
          }
          if (message.type === "homekit_manager/migration_plan") {
            const target = message.target || "homekit_bridge";
            return { source: "homekit_bridge", target, supported: false, status: target === "homekit_bridge" ? "not_applicable" : "blocked", reason: "Quellenmigration ist nicht vorgesehen", steps: [] };
          }
          if (message.type === "homekit_manager/migration_status") {
            return { state: "unknown", stale: true };
          }
          if (message.type === "homekit_manager/management_status") {
            return { state: managementActive ? "active" : "not_enabled", configuration_source: "home_assistant", configuration_source_label: "Home Assistant", management_surface: managementActive ? "homekit_manager" : "home_assistant", management_surface_label: managementActive ? "HomeKit Manager" : "Home Assistant", supported: true, active: managementActive, write_status: "locked", write_status_label: "Gesperrt", bridge_title: "Fixture Bridge", message: managementActive ? "HomeKit Manager verwaltet diese Bridge jetzt." : "HomeKit Manager kann diese bestehende Bridge nach Bestätigung verwalten." };
          }
          if (message.type === "homekit_manager/management_enable") {
            managementActive = true;
            return { state: "active", configuration_source: "home_assistant", configuration_source_label: "Home Assistant", management_surface: "homekit_manager", management_surface_label: "HomeKit Manager", supported: true, active: true, bridge_title: "Fixture Bridge", message: "HomeKit Manager verwaltet diese Bridge jetzt." };
          }
          if (message.type === "homekit_manager/management_disable") {
            managementActive = false;
            return { state: "inactive", configuration_source: "home_assistant", configuration_source_label: "Home Assistant", management_surface: "home_assistant", management_surface_label: "Home Assistant", supported: true, active: false, bridge_title: "Fixture Bridge", write_status: "locked", write_status_label: "Gesperrt", message: "Die Verwaltung wurde auf Home Assistant zurückgestellt." };
          }
          if (message.type === "homekit_manager/devices") {
            return { devices: [{ device_id: "fixture-device", name: "Kitchen device", area_name: "Kitchen", entity_count: 1, compatible_count: 1, configured_count: 1, unavailable_count: 0, integrations: ["demo"] }] };
          }
          if (message.type === "homekit_manager/areas") {
            return { areas: [{ area_id: "fixture-area", name: "Kitchen", device_count: 1, entity_count: 1, compatible_count: 1, configured_count: 1, unavailable_count: 0 }] };
          }
          if (message.type === "homekit_manager/diagnostics") {
            return { findings: [], summary: { total: 0, critical: 0, warning: 0, info: 0, success: 0 } };
          }
          if (message.type === "homekit_manager/rules_preview") {
            return { rules: [], suggestions: [], applied: false };
          }
          if (message.type === "homekit_manager/performance") {
            return { entity_count: entities.length, refresh_duration_ms: 3.2, refresh_count: 1, last_updated: "2026-10-27T08:00:00Z" };
          }
          if (message.type === "homekit_manager/device_preview") {
            return { simulation: true, title: "Kitchen light", service_type: "Lightbulb", applied: false };
          }
          if (message.type === "homekit_manager/validate_draft") {
            return { valid: true, warnings: [], document: message.document, fingerprint: "fixture-fingerprint" };
          }
          if (message.type === "homekit_manager/preview") {
            return {
              valid: true,
              changes: [{ entity_id: "light.kitchen", current: "included", desired: "excluded", action: "remove", reason: "explicit_exclude" }],
              summary: { blocked: false },
              fingerprint: "fixture-fingerprint",
            };
          }
          if (message.type === "homekit_manager/export") {
            return { format: "yaml", content: "schema_version: 1\nbridges: {}\n" };
          }
          if (message.type === "homekit_manager/save_draft") {
            savedDocument = message.document;
            return { exists: true, valid: true, document: savedDocument, file_version: "fixture-version-2", fingerprint: "fixture-fingerprint-2", is_applied: false };
          }
          if (message.type === "homekit_manager/apply_options_diff") {
            throw new Error("HomeKit-Schreibpfad gesperrt");
          }
          if (message.type === "homekit_manager/test_write_mode_enable") {
            if (message.entry_id !== "fixture-bridge" || message.confirmed_entry_id !== "fixture-bridge" || message.expected_fingerprint !== "fixture-fingerprint") throw new Error("Testmodus blockiert");
            testModeActive = true; return { enabled: true, entry_id: "fixture-bridge", persistent: false };
          }
          if (message.type === "homekit_manager/test_write_mode_disable") {
            testModeActive = false; return { enabled: false, persistent: false };
          }
          if (message.type === "homekit_manager/operation_plan") {
            if (message.entry_id !== "fixture-bridge" || message.expected_fingerprint !== "fixture-fingerprint") throw new Error("Bridge oder Revision geändert");
            operationState = "validated";
            const migration = message.document?.bridges?.[message.entry_id]?.migration_acknowledged === true;
            return { operation_id: "fixture-operation-1", entry_id: message.entry_id, source: "user", source_revision: "fixture-source-revision", changed_entities: migration ? [] : ["light.kitchen"], change_details: migration ? [] : [{ entity_id: "light.kitchen", current: "included", desired: "excluded", action: "remove" }], migration: migration ? { selected_before: 1, hap_published_before: 1, published_removals: [], future_entities_excluded: true } : null, state: operationState, apply_enabled: isolatedWrite || testModeActive };
          }
          if (message.type === "homekit_manager/operation_apply") {
            if (!(isolatedWrite || testModeActive) || message.operation_id !== "fixture-operation-1" || message.confirmed_operation_id !== message.operation_id || operationState !== "validated") throw new Error("Operation blockiert");
            operationState = "verified";
            entities[0].homekit.configured_by_filter = false; entities[0].homekit.current_status = "excluded";
            return { operation_id: message.operation_id, entry_id: message.entry_id, state: operationState, pairing_verified: false };
          }
          if (message.type === "homekit_manager/operation_status" || message.type === "homekit_manager/operation_reconcile") {
            return { operation_id: message.operation_id, state: operationState, automatic_retry: false };
          }
          throw new Error(`Unsupported fixture command: ${message.type}`);
        },
      };
      window.addEventListener("DOMContentLoaded", () => {
        document.querySelector("homekit-manager-panel").hass = hass;
      }, { once: true });
    </script>
  </head>
  <body style="margin:0;background:var(--primary-background-color);color:var(--primary-text-color)">
    <homekit-manager-panel></homekit-manager-panel>
  </body>
</html>
